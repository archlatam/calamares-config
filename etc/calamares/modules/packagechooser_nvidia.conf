      name: "Do not install NVIDIA drivers"
      name[en]: "Do not install NVIDIA drivers"
      name[es]: "No instalar drivers NVIDIA"
      name[pt]: "Não instalar drivers NVIDIA"
      name[fr]: "Ne pas installer les pilotes NVIDIA"
      description: "Continue without installing NVIDIA drivers."
      description[en]: "Continue without installing NVIDIA drivers."
      description[es]: "Continuar sin instalar drivers NVIDIA."
      description[pt]: "Continuar sem instalar os drivers NVIDIA."
      description[fr]: "Continuer sans installer les pilotes NVIDIA."
