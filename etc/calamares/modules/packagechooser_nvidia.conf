#
### NVIDIA driver chooser
#
# Muestra al usuario la opción de instalar los drivers NVIDIA.
# Por defecto aparece desmarcada: solo se instala si el usuario la activa.
# ---
# mode: optional
# method: legacy
# labels:
#     step: "Drivers NVIDIA"
#     step[es]: "Drivers NVIDIA"
# items:
#     - id: nvidia
#       name: "Instalar drivers NVIDIA"
#       description: "Instala automáticamente el driver NVIDIA adecuado (open o legacy) según la GPU detectada."
#       screenshot: "/etc/calamares/images/nvidia.png"


# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
---
mode: optional
method: legacy

labels:
